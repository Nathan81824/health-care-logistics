<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==================================================
                    META
    ================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="IDOKO LEGACY Healthcare Logistics Dashboard"
    >

    <meta
        name="theme-color"
        content="#071827"
    >

    <title>IDOKO LEGACY Dashboard</title>


    <!-- ==================================================
                    FAVICON
    ================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="../assets/logo/ChatGPT_Image_Aug_6__2026__01_13_27_AM-removebg-preview.png"
    >


    <!-- ==================================================
                    GLOBAL CSS
    ================================================== -->

    <link
        rel="stylesheet"
        href="../assets/css/global.css"
    >


    <!-- ==================================================
                    FONT AWESOME
    ================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body
    class="dashboard"
    data-page="dashboard"
>


    <!-- ==================================================
                    DASHBOARD LAYOUT
    ================================================== -->

    <div class="dashboard-layout">


        <!-- ==================================================
                        SIDEBAR
        ================================================== -->

        <aside
            id="sidebar-container"
            aria-label="Dashboard navigation"
        ></aside>



        <!-- ==================================================
                        MAIN
        ================================================== -->

        <main class="dashboard-main">


            <!-- ==================================================
                            TOPBAR
            ================================================== -->

            <header
                id="topbar-container"
                aria-label="Dashboard topbar"
            ></header>



            <!-- ==================================================
                        DASHBOARD CONTENT
            ================================================== -->

            <div class="dashboard-content">


                <!-- ==================================================
                            OVERVIEW
                ================================================== -->

                <section
                    id="overview-container"
                    aria-label="Dashboard overview"
                ></section>



                <!-- ==================================================
                            ANALYTICS
                ================================================== -->

                <section
                    id="analytics-container"
                    aria-label="Dashboard analytics"
                ></section>



                <!-- ==================================================
                            SHIPMENTS
                ================================================== -->

                <section
                    id="shipments-container"
                    aria-label="Shipment information"
                ></section>



                <!-- ==================================================
                            ACTIVITY
                ================================================== -->

                <section
                    id="activity-container"
                    aria-label="Recent activity"
                ></section>



                <!-- ==================================================
                            FLEET
                ================================================== -->

                <section
                    id="fleet-container"
                    aria-label="Fleet information"
                ></section>



                <!-- ==================================================
                            INVENTORY
                ================================================== -->

                <section
                    id="inventory-container"
                    aria-label="Inventory information"
                ></section>



                <!-- ==================================================
                            HOSPITALS
                ================================================== -->

                <section
                    id="hospitals-container"
                    aria-label="Hospital information"
                ></section>



                <!-- ==================================================
                            DRIVERS
                ================================================== -->

                <section
                    id="drivers-container"
                    aria-label="Driver information"
                ></section>



                <!-- ==================================================
                            LIVE TRACKING
                ================================================== -->

                <section
                    id="tracking-container"
                    aria-label="Live tracking"
                ></section>



                <!-- ==================================================
                            REPORTS
                ================================================== -->

                <section
                    id="reports-container"
                    aria-label="Reports"
                ></section>


            </div>

        </main>

    </div>



    <!-- ==================================================
                    LOGOUT POPUP
    ================================================== -->

    <div
        id="logout-popup-container"
        aria-hidden="true"
    ></div>



    <!-- ==================================================
                    CORE
    ================================================== -->

    <script src="../assets/js/core/helpers.js"></script>

    <script src="../assets/js/auth/storage.js"></script>

    <script src="../assets/js/core/observer.js"></script>

    <script src="../assets/js/core/scroll.js"></script>

    <script src="../assets/js/core/scrollReveal.js"></script>

    <script src="../assets/js/core/loader.js"></script>



    <!-- ==================================================
                    DASHBOARD
    ================================================== -->

    <script src="../assets/js/dashboard/dashboard.js"></script>

    <script src="../assets/js/dashboard/sidebar.js"></script>



    <!-- ==================================================
                    UTILITIES
    ================================================== -->

    <script src="../assets/js/utilities/stats.js"></script>

    <script src="../assets/js/utilities/testimonials.js"></script>

    <script src="../assets/js/utilities/footer.js"></script>



    <!-- ==================================================
                    NAVIGATION
    ================================================== -->

    <script src="../assets/js/utilities/navbar.js"></script>

    <script src="../assets/js/dashboard/top-bar.js"></script>



    <!-- ==================================================
                    LOGOUT
    ================================================== -->

    <script src="../assets/js/utilities/logout-popup.js"></script>



    <!-- ==================================================
                    NOTIFICATIONS
    ================================================== -->

    <script src="../assets/js/core/notification.js"></script>

    <script src="../assets/js/core/notification-ui.js"></script>



    <!-- ==================================================
                    MAIN
    ================================================== -->

    <script src="../assets/js/core/main.js"></script>


</body>

</html>
