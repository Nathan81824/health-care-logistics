<!--=====================================
            LOGOUT POPUP
======================================-->

<div
    id="logoutPopup"
    class="logout-popup">

    <!-- Overlay -->

    <div
        class="logout-overlay"
        id="logoutOverlay">
    </div>



    <!-- Popup Card -->

    <div class="logout-card">

        <!-- Icon -->

        <div class="logout-icon">

            <i class="fa-solid fa-right-from-bracket"></i>

        </div>



        <!-- Text -->

        <h3>

            Log Out

        </h3>

        <p>

            Are you sure you want to log out of your account?

        </p>



        <!-- Buttons -->

        <div class="logout-actions">

            <button
                id="cancelLogout"
                class="btn-cancel"
                type="button">

                Cancel

            </button>

            <button
                id="confirmLogout"
                class="btn-logout"
                type="button">

                Log Out

            </button>

        </div>

    </div>

</div>
