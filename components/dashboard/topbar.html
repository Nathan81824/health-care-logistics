<!--==================================================
                    DASHBOARD TOPBAR
===================================================-->

<header
    class="dashboard-topbar"
    data-reveal>


    <!--==================================================
                        LEFT SIDE
    ===================================================-->

    <div class="topbar-left">


        <!--==================================================
                        MOBILE MENU
        ===================================================-->

        <button
            type="button"
            class="menu-toggle"
            id="menuToggle"
            aria-label="Open dashboard menu"
            aria-expanded="false">

            <i class="fa-solid fa-bars"></i>

        </button>



        <!--==================================================
                        PAGE TITLE
        ===================================================-->

        <div class="page-title">


            <span class="breadcrumb">

                Dashboard

            </span>


            <h2>

                Healthcare Logistics Dashboard

            </h2>


        </div>


    </div>



    <!--==================================================
                        RIGHT SIDE
    ===================================================-->

    <div class="topbar-right">


        <!--==================================================
                            SEARCH
        ===================================================-->

        <div class="topbar-search">


            <i class="fa-solid fa-magnifying-glass"></i>


            <input
                type="search"
                id="dashboardSearch"
                placeholder="Search shipments..."
                aria-label="Search shipments">


        </div>



        <!--==================================================
                        NOTIFICATIONS
        ===================================================-->

        <div
            class="notification-wrapper">


            <!--==================================================
                        NOTIFICATION BUTTON
            ===================================================-->

            <button
                type="button"
                class="topbar-btn notification-btn"
                aria-label="Open notifications"
                aria-expanded="false">


                <i class="fa-regular fa-bell"></i>


                <!-- UNREAD DOT -->

                <span
                    class="notification-dot"
                    aria-hidden="true">
                </span>


                <!-- UNREAD COUNT -->

                <span
                    class="notification-count"
                    aria-hidden="true">
                </span>


            </button>



            <!--==================================================
                    NOTIFICATION DROPDOWN
            ===================================================-->

            <div
                class="notification-dropdown"
                id="notificationDropdown"
                aria-hidden="true">


                <!--==================================================
                        NOTIFICATION HEADER
                ===================================================-->

                <div class="notification-header">


                    <!-- TITLE -->

                    <div class="notification-title">


                        <h4>

                            Notifications

                        </h4>


                    </div>



                    <!--==================================================
                            ACTIONS
                    ===================================================-->

                    <div class="notification-actions">


                        <!-- UNREAD COUNT -->

                        <span
                            class="notification-count"
                            aria-label="Unread notifications">
                        </span>



                        <!-- DELETE ALL -->

                        <button
                            type="button"
                            class="delete-all-notifications"
                            id="deleteAllNotifications"
                            title="Delete all notifications"
                            aria-label="Delete all notifications">


                            <i class="fa-solid fa-trash"></i>


                            <span>

                                Delete All

                            </span>


                        </button>



                        <!-- CLOSE -->

                        <button
                            type="button"
                            class="close-notification"
                            title="Close notifications"
                            aria-label="Close notifications">


                            <i class="fa-solid fa-xmark"></i>


                        </button>


                    </div>


                </div>



                <!--==================================================
                        NOTIFICATION LIST

                        notification-ui.js controls this.
                ===================================================-->

                <div
                    id="notificationList"
                    class="notification-list">
                </div>


            </div>


        </div>



        <!--==================================================
                        THEME TOGGLE
        ===================================================-->

        <button
            type="button"
            class="topbar-btn theme-toggle"
            title="Toggle Theme"
            aria-label="Toggle dark and light mode">


            <i class="fa-solid fa-moon"></i>


        </button>



        <!--==================================================
                        PROFILE
        ===================================================-->

        <div class="profile">


            <!--==================================================
                        PROFILE CARD
            ===================================================-->

            <button
                type="button"
                class="profile-card"
                id="profileCard"
                aria-label="Open profile menu"
                aria-expanded="false">


                <!-- AVATAR -->

                <div class="profile-avatar">


                    <span id="topbarInitial">

                        G

                    </span>


                    <span class="online-status"></span>


                </div>



                <!-- USER INFORMATION -->

                <div class="profile-info">


                    <h4 id="topbarUsername">

                        Guest

                    </h4>


                    <span>

                        Administrator

                    </span>


                </div>



                <!-- CHEVRON -->

                <div class="profile-arrow">


                    <i class="fa-solid fa-chevron-down"></i>


                </div>


            </button>



            <!--==================================================
                        PROFILE DROPDOWN
            ===================================================-->

            <div
                class="profile-dropdown"
                id="profileDropdown">


                <!--==================================================
                        USER INFORMATION
                ===================================================-->

                <div class="dropdown-user">


                    <!-- AVATAR -->

                    <div class="dropdown-avatar">


                        <span id="topbarDropdownInitial">

                            G

                        </span>


                    </div>



                    <!-- USER DETAILS -->

                    <div class="dropdown-user-details">


                        <h4 id="topbarDropdownUsername">

                            Guest

                        </h4>


                        <p id="topbarEmail">

                            Please sign in

                        </p>


                    </div>


                </div>



                <!-- DIVIDER -->

                <div class="dropdown-divider"></div>



                <!--==================================================
                        PROFILE
                ===================================================-->

                <a
                    href="#"
                    id="topbarProfileLink">


                    <i class="fa-regular fa-user"></i>


                    <span>

                        My Profile

                    </span>


                </a>



                <!--==================================================
                        DASHBOARD
                ===================================================-->

                <a
                    href="../pages/dashboard.html"
                    id="topbarDashboardLink">


                    <i class="fa-solid fa-table-columns"></i>


                    <span>

                        Dashboard

                    </span>


                </a>



                <!--==================================================
                        SHIPMENTS
                ===================================================-->

                <a
                    href="#"
                    id="topbarShipmentsLink">


                    <i class="fa-solid fa-box"></i>


                    <span>

                        My Shipments

                    </span>


                </a>



                <!--==================================================
                        ORDER HISTORY
                ===================================================-->

                <a
                    href="#"
                    id="topbarHistoryLink">


                    <i class="fa-solid fa-clock-rotate-left"></i>


                    <span>

                        Order History

                    </span>


                </a>



                <!-- DIVIDER -->

                <div class="dropdown-divider"></div>



                <!--==================================================
                        QUICK ACCESS
                ===================================================-->

                <div class="quick-access-wrapper">


                    <!-- QUICK ACCESS BUTTON -->

                    <button
                        type="button"
                        class="quick-access-btn"
                        id="quickAccessBtn">


                        <i class="fa-solid fa-bolt"></i>


                        <span>

                            Quick Access

                        </span>


                        <i class="fa-solid fa-chevron-right"></i>


                    </button>



                    <!--==================================================
                            QUICK ACCESS MENU
                    ===================================================-->

                    <div class="quick-menu">


                        <!-- LIVE TRACKING -->

                        <a href="#">

                            <i class="fa-solid fa-satellite-dish"></i>

                            <span>

                                Live Tracking

                            </span>

                        </a>



                        <!-- COLD CHAIN -->

                        <a href="#">

                            <i class="fa-solid fa-temperature-half"></i>

                            <span>

                                Cold Chain Monitor

                            </span>

                        </a>



                        <!-- AI ASSISTANT -->

                        <a href="#">

                            <i class="fa-solid fa-robot"></i>

                            <span>

                                AI Assistant

                            </span>

                        </a>



                        <!-- SHIPMENT MAP -->

                        <a href="#">

                            <i class="fa-solid fa-map-location-dot"></i>

                            <span>

                                Shipment Map

                            </span>

                        </a>



                        <!-- SUPPORT -->

                        <a href="#">

                            <i class="fa-solid fa-headset"></i>

                            <span>

                                Support Center

                            </span>

                        </a>



                        <!-- ACCOUNT SETTINGS -->

                        <a href="#">

                            <i class="fa-solid fa-user-gear"></i>

                            <span>

                                Account Settings

                            </span>

                        </a>


                    </div>


                </div>



                <!-- DIVIDER -->

                <div class="dropdown-divider"></div>



                <!--==================================================
                        SETTINGS
                ===================================================-->

                <a
                    href="#"
                    id="topbarSettingsLink">


                    <i class="fa-solid fa-gear"></i>


                    <span>

                        Settings

                    </span>


                </a>



                <!--==================================================
                        HELP
                ===================================================-->

                <a
                    href="#"
                    id="topbarHelpLink">


                    <i class="fa-solid fa-circle-question"></i>


                    <span>

                        Help Center

                    </span>


                </a>



                <!--==================================================
                        LOGOUT
                ===================================================-->

                <a
                    href="#"
                    id="logoutTopbar"
                    class="logout-link">


                    <i class="fa-solid fa-arrow-right-from-bracket"></i>


                    <span>

                        Logout

                    </span>


                </a>


            </div>


        </div>


    </div>


</header>
